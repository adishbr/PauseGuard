<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pauseguard.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PauseGuard | Simulation</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pauseguard:theme');
          var mode = (saved === 'light' || saved === 'dark') ? saved :
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.setAttribute('data-theme-preference', saved || 'system');
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
