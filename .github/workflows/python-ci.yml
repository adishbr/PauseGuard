name: Python CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "integration/**"
      - "release/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Existing offline Python test job
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run all project tests
        run: python -m pytest tests backend/tests -v

  # Separate disposable PostgreSQL integration test job
  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pauseguard_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pauseguard_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PAUSEGUARD_POSTGRES_TEST_AUTHORIZED: "true"
      PAUSEGUARD_POSTGRES_TEST_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/pauseguard_test_ci
      PAUSEGUARD_POSTGRES_TEST_PASSWORD: ci_only_disposable_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run PostgreSQL integration suite
        run: python -m pytest -c backend/pytest_integration.ini backend/tests_integration -v
